<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>空跳設備</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
            font-size: 14px; line-height: 1.5; max-width: 320px; pointer-events: none; z-index: 10;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            margin-top: -5px; margin-left: -5px; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }
        #msg {
            position: absolute; top: 40%; width: 100%; text-align: center;
            color: #ff3333; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000;
            display: none; pointer-events: none; z-index: 10;
        }
        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 5px; text-align: center;
            font-size: 16px; cursor: pointer; z-index: 20;
        }
    </style>
    <!-- Three.js (3D描画ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="ui">
        <div><b>HP:</b> <span id="hp-val">600</span> / 600</div>
        <div><b>残機:</b> <span id="lives-val">3</span></div>
        <div><b>ステージ:</b> <span id="stage-val">1</span> / 2 (遭遇: <span id="wave-val">1</span>)</div>
        <div><b>進行状況:</b> <span id="progress-val">奧へ進んでください</span></div>
        <div><b>武器 [1-7]:</b> <span id="weapon-val">ノーマルメリケン</span></div>
        <div><b>弾薬/状態:</b> <span id="ammo-val">∞</span></div>
        <div><b>特殊技:</b> <span id="skill-val">Eキーで発動</span></div>
        <div style="margin-top: 5px; color: #aaa; font-size: 12px;" id="weapon-desc"></div>
    </div>
    <div id="msg"></div>
    <div id="instructions">【ここをクリックしてゲーム開始】<br><span style="font-size: 12px; color: #ccc;">(Pキー: ポーズ / 1-7キー: 武器切替)</span></div>

    <script>
        // --- 武器データ定義 ---
        const WEAPONS = [
            { name: "ノーマルメリケン", atk: 20, desc: "特殊技: 3秒間で700回前方パンチ" },
            { name: "木刀", atk: 40, desc: "特殊技: 剣をぶん回して移動しながら攻撃" },
            { name: "拳銃", atk: 60, desc: "3発リロード6秒 / 特殊技: 8秒間無制限＆全弾必中" },
            { name: "ノーマルアックス", atk: 80, desc: "硬直2秒 / 特殊技: 大ジャンプ衝撃波(190ダメ)" },
            { name: "ノーマルスピア", atk: 90, desc: "硬直4秒 / 特殊技: 槍投擲テレポート＆雨(60ダメx670本)" },
            { name: "初弓", atk: 10, desc: "2秒チャージ最大5発(威力1.5倍累計) / 特殊技: 貫通矢(590ダメ)" },
            { name: "アイアンシールド", atk: 0, desc: "前方防御/W2回ダッシュ / 特殊技: サーフィン15秒(70ダメ+速度1.7倍)" }
        ];

        // ステージ構造
        const STAGE_WAVES = {
            1: [
                { triggerZ: -20, trash: 3, mop: 7, tawashi: 2 },
                { triggerZ: -100, mold: 10, trash: 3 },
                { triggerZ: -180, joy: 3, tawashi: 7, mop: 3, trash: 4 }
            ],
            2: [
                { triggerZ: -20, trash: 13 },
                { triggerZ: -60, tawashi: 9, mop: 3 },
                { triggerZ: -100, joy: 6, tawashi: 2, trash: 6 },
                { triggerZ: -140, mold: 25, trash: 3, trash_big: 1 },
                { triggerZ: -180, mop_long: 1, trash_big: 6, joy: 15 },
                { triggerZ: -220, trash_big: 6, mop_long: 3, joy: 15 }
            ]
        };

        const BOUNDS = { minX: -13.5, maxX: 13.5, minY: 1.0, maxY: 18.5, minZ: -285.0, maxZ: 10.0 };

        let scene, camera, renderer;
        let player = {
            hp: 600, maxHp: 600, lives: 3,
            pos: new THREE.Vector3(0, 2, 0),
            vel: new THREE.Vector3(),
            rotY: 0, rotX: 0,
            weaponIdx: 0,
            ammo: 3, isReloading: false, reloadTimer: 0,
            chargeTimer: 0, isCharging: false,
            cooldown: 0, skillActiveTimer: 0,
            isSurfing: false, surfTimer: 0
        };

        let keys = {};
        let lastWTime = 0;
        let enemies = [];
        let floatingTexts = [];
        let stage = 1, wave = 0;
        let waveSpawned = false;
        let gameStarted = false;
        let isLocked = false, isPaused = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x3a3a48);
            scene.fog = new THREE.FogExp2(0x3a3a48, 0.005);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambient);
            
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight1.position.set(20, 50, 20);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xaaccff, 0.8);
            dirLight2.position.set(-20, 30, -50);
            scene.add(dirLight2);

            buildDuctMap();

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', e => onKeyDown(e));
            document.addEventListener('keyup', e => keys[e.code] = false);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);

            // クリック開始処理の強化
            window.addEventListener('click', startGame);

            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
            });

            checkWaveTrigger();
            animate();
        }

        function startGame() {
            if (!gameStarted) {
                gameStarted = true;
                document.getElementById('instructions').style.display = 'none';
            }
            if (!isLocked && !isPaused) {
                document.body.requestPointerLock();
            }
        }

        function buildDuctMap() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x99aabb, metalness: 0.5, roughness: 0.2 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 0.4 });
            const backMat = new THREE.MeshStandardMaterial({ color: 0x556677 });

            const floor = new THREE.Mesh(new THREE.BoxGeometry(30, 1, 300), floorMat);
            floor.position.set(0, -0.5, -135);
            scene.add(floor);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 20, 300), wallMat);
            leftWall.position.set(-15, 10, -135);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 20, 300), wallMat);
            rightWall.position.set(15, 10, -135);
            scene.add(rightWall);

            const ceil = new THREE.Mesh(new THREE.BoxGeometry(30, 1, 300), wallMat);
            ceil.position.set(0, 20, -135);
            scene.add(ceil);

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(30, 20, 1), backMat);
            backWall.position.set(0, 10, 15);
            scene.add(backWall);

            const farWall = new THREE.Mesh(new THREE.BoxGeometry(30, 20, 1), backMat);
            farWall.position.set(0, 10, -290);
            scene.add(farWall);
        }

        function checkWaveTrigger() {
            const waves = STAGE_WAVES[stage];
            if (wave >= waves.length) {
                if (stage === 1) {
                    showMessage("ステージ1 汚染完了！ ステージ2へ...", 3000);
                    setTimeout(() => {
                        stage = 2; wave = 0; waveSpawned = false;
                        player.pos.set(0, 2, 0); updateUI();
                    }, 3000);
                } else {
                    showMessage("全ステージクリア！おめでとうございます！", 100000);
                    isPaused = true;
                }
                return;
            }

            const currentWaveData = waves[wave];
            if (!waveSpawned && player.pos.z <= currentWaveData.triggerZ) {
                spawnEnemies(currentWaveData);
                waveSpawned = true;
                showMessage("敵群 遭遇！", 2000);
            }
            updateUI();
        }

        function spawnEnemies(data) {
            let spawnZ = player.pos.z - 25;
            for (let type in data) {
                if (type === 'triggerZ') continue;
                let count = data[type];
                for (let i = 0; i < count; i++) {
                    let e = createEnemy(type);
                    e.mesh.position.set((Math.random() - 0.5) * 20, e.height / 2, spawnZ - Math.random() * 40);
                    scene.add(e.mesh);
                    enemies.push(e);
                }
            }
        }

        function createEnemy(type) {
            let group = new THREE.Group();
            let hp, atk, height = 2, speed = 4;
            let enemyData = { type, mesh: group, hp, maxHp: hp, atk, height, speed, state: 'idle', invulnerable: false, timer: 0 };

            if (type === 'tawashi') {
                hp = 300; atk = 60; height = 1.6; speed = 5;
                const bodyGeo = new THREE.SphereGeometry(1.0, 16, 12); bodyGeo.scale(1.2, 0.8, 1.4);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
                group.add(new THREE.Mesh(bodyGeo, bodyMat));

                const spikeGeo = new THREE.ConeGeometry(0.06, 0.5, 4);
                const spikeMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.6 });
                for (let i = 0; i < 110; i++) {
                    const spike = new THREE.Mesh(spikeGeo, spikeMat);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI * 0.6;
                    const r = 0.9;
                    spike.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi) * 0.6 + 0.2, r * Math.sin(phi) * Math.sin(theta));
                    spike.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
                    spike.rotation.y = theta;
                    group.add(spike);
                }

                const faceGroup = new THREE.Group();
                faceGroup.position.set(0, 0.1, 1.2);

                const angryGroup = new THREE.Group();
                const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
                const redEyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const eyeL = new THREE.Mesh(eyeGeo, redEyeMat); eyeL.position.set(-0.3, 0.2, 0);
                const eyeR = new THREE.Mesh(eyeGeo, redEyeMat); eyeR.position.set(0.3, 0.2, 0);
                angryGroup.add(eyeL, eyeR);

                const browGeo = new THREE.BoxGeometry(0.3, 0.05, 0.05);
                const browMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const browL = new THREE.Mesh(browGeo, browMat); browL.position.set(-0.3, 0.35, 0.05); browL.rotation.z = -0.4;
                const browR = new THREE.Mesh(browGeo, browMat); browR.position.set(0.3, 0.35, 0.05); browR.rotation.z = 0.4;
                angryGroup.add(browL, browR);

                const mouthGeo = new THREE.BoxGeometry(0.4, 0.08, 0.05);
                const mouthMat = new THREE.MeshBasicMaterial({ color: 0x220000 });
                const angryMouth = new THREE.Mesh(mouthGeo, mouthMat); angryMouth.position.set(0, -0.1, 0);
                angryGroup.add(angryMouth);

                const cryingGroup = new THREE.Group();
                cryingGroup.visible = false;

                const sadEyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
                const sadEyeL = new THREE.Mesh(eyeGeo, sadEyeMat); sadEyeL.position.set(-0.3, 0.15, 0);
                const sadEyeR = new THREE.Mesh(eyeGeo, sadEyeMat); sadEyeR.position.set(0.3, 0.15, 0);
                cryingGroup.add(sadEyeL, sadEyeR);

                const tearGeo = new THREE.SphereGeometry(0.08, 8, 8); tearGeo.scale(0.8, 1.8, 0.8);
                const tearMat = new THREE.MeshBasicMaterial({ color: 0x00dfff });
                const tearL = new THREE.Mesh(tearGeo, tearMat); tearL.position.set(-0.3, -0.05, 0.08);
                const tearR = new THREE.Mesh(tearGeo, tearMat); tearR.position.set(0.3, -0.05, 0.08);
                cryingGroup.add(tearL, tearR);

                const sadMouthGeo = new THREE.TorusGeometry(0.18, 0.03, 8, 12, Math.PI);
                const sadMouthMat = new THREE.MeshBasicMaterial({ color: 0x330000 });
                const sadMouth = new THREE.Mesh(sadMouthGeo, sadMouthMat); sadMouth.position.set(0, -0.15, 0); sadMouth.rotation.x = Math.PI;
                cryingGroup.add(sadMouth);

                faceGroup.add(angryGroup, cryingGroup);
                group.add(faceGroup);

                enemyData.angryFace = angryGroup;
                enemyData.cryingFace = cryingGroup;
                enemyData.invulnerable = true;
                enemyData.timer = 0;
            } else {
                let mat = new THREE.MeshStandardMaterial({ roughness: 0.5 });
                let mesh;
                if (type === 'trash' || type === 'trash_big') {
                    let isBig = type === 'trash_big';
                    hp = isBig ? 500 : 360; atk = isBig ? 70 : 50; height = isBig ? 4 : 2;
                    mat.color.setHex(0x777777);
                    mesh = new THREE.Mesh(new THREE.CylinderGeometry(height/2, height/2, height), mat);
                } else if (type === 'mop' || type === 'mop_long') {
                    let isLong = type === 'mop_long';
                    hp = 400; atk = isLong ? 90 : 70; height = isLong ? 5 : 3;
                    mat.color.setHex(0x33bbff);
                    mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, height), mat);
                } else if (type === 'mold') {
                    hp = 400; atk = 30; mat.color.setHex(0xffffff);
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 1.5), mat);
                } else if (type === 'joy') {
                    hp = 250; atk = 70; mat.color.setHex(0xffff33);
                    mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2.5), mat);
                } else {
                    hp = 100; atk = 10;
                    mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
                }
                group.add(mesh);
            }

            enemyData.hp = hp; enemyData.maxHp = hp; enemyData.atk = atk; enemyData.height = height;
            return enemyData;
        }

        function spawnDamageText(position, text) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = 'Bold 54px Arial, sans-serif'; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 6;
            ctx.strokeText(text, 128, 70); ctx.fillText(text, 128, 70);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.copy(position).add(new THREE.Vector3((Math.random() - 0.5) * 0.5, 1.2, (Math.random() - 0.5) * 0.5));
            sprite.scale.set(3, 1.5, 1);

            scene.add(sprite);
            floatingTexts.push({ sprite, life: 1.0 });
        }

        function onKeyDown(e) {
            keys[e.code] = true;
            if (e.key >= '1' && e.key <= '7') {
                player.weaponIdx = parseInt(e.key) - 1; updateUI();
            }
            if (e.code === 'KeyW') {
                let now = performance.now();
                if (now - lastWTime < 300) player.vel.z = -30;
                lastWTime = now;
            }
            if (e.code === 'KeyP') {
                isPaused = !isPaused;
                showMessage(isPaused ? "PAUSE" : "", 0);
            }
            if (e.code === 'KeyE') useSpecialSkill();
        }

        function onMouseMove(e) {
            if (isPaused) return;
            // ポインターロック時もそうでない時も対応
            let dx = e.movementX || 0;
            let dy = e.movementY || 0;
            player.rotY -= dx * 0.003;
            player.rotX -= dy * 0.003;
            player.rotX = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, player.rotX));
        }

        function onMouseDown(e) {
            if (e.button === 0 && !isPaused) attack();
        }

        function onMouseUp(e) {
            if (e.button === 0 && player.isCharging) fireBow();
        }

        function attack() {
            if (player.cooldown > 0) return;
            const w = WEAPONS[player.weaponIdx];
            if (w.name === "拳銃") {
                if (player.ammo <= 0) return;
                player.ammo--; dealFrontDamage(w.atk, 50); player.cooldown = 0.3;
                if (player.ammo === 0) { player.isReloading = true; player.reloadTimer = 6.0; }
            } else if (w.name === "ノーマルアックス") {
                dealFrontDamage(w.atk, 5); player.cooldown = 2.0;
            } else if (w.name === "ノーマルスピア") {
                dealFrontDamage(w.atk, 7); player.cooldown = 4.0;
            } else if (w.name === "初弓") {
                player.isCharging = true; player.chargeTimer = 0;
            } else {
                dealFrontDamage(w.atk, 4); player.cooldown = 0.4;
            }
            updateUI();
        }

        function fireBow() {
            player.isCharging = false;
            let arrows = Math.min(5, 1 + Math.floor(player.chargeTimer / 2.0));
            let mult = Math.pow(1.5, arrows - 1);
            let totalDmg = Math.round(10 * arrows * mult);
            dealFrontDamage(totalDmg, 60); player.cooldown = 0.5; updateUI();
        }

        function useSpecialSkill() {
            const w = WEAPONS[player.weaponIdx];
            if (w.name === "ノーマルメリケン") {
                let duration = 3.0;
                let interval = setInterval(() => {
                    dealFrontDamage(w.atk, 4); duration -= 0.08;
                    if (duration <= 0) clearInterval(interval);
                }, 80);
            } else if (w.name === "拳銃") {
                player.skillActiveTimer = 8.0; player.ammo = 999;
            } else if (w.name === "ノーマルアックス") {
                player.vel.y = 15;
                setTimeout(() => { enemies.forEach(e => applyDamage(e, 190)); }, 600);
            } else if (w.name === "ノーマルスピア") {
                player.pos.z = Math.max(BOUNDS.minZ, player.pos.z - 20);
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        enemies.forEach(e => { if (e.mesh.position.distanceTo(player.pos) < 18) applyDamage(e, 300); });
                    }, i * 50);
                }
            } else if (w.name === "初弓") {
                dealFrontDamage(590, 100);
            } else if (w.name === "アイアンシールド") {
                player.isSurfing = true; player.surfTimer = 15.0;
            }
        }

        function dealFrontDamage(dmg, range) {
            let dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);
            enemies.forEach(e => {
                let toEnemy = e.mesh.position.clone().sub(player.pos);
                if (toEnemy.length() < range && toEnemy.dot(dir) > 0) applyDamage(e, dmg);
            });
        }

        function applyDamage(e, dmg) {
            if (e.type === 'tawashi' && e.invulnerable) {
                spawnDamageText(e.mesh.position, "BLOCK!"); return;
            }
            e.hp -= dmg;
            spawnDamageText(e.mesh.position, String(Math.round(dmg)));
            if (e.hp <= 0) scene.remove(e.mesh);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isPaused) return;

            let dt = 0.016;

            if (player.isReloading) {
                player.reloadTimer -= dt;
                if (player.reloadTimer <= 0) { player.isReloading = false; player.ammo = 3; updateUI(); }
            }
            if (player.isCharging) player.chargeTimer += dt;
            if (player.cooldown > 0) player.cooldown -= dt;
            if (player.surfTimer > 0) {
                player.surfTimer -= dt;
                if (player.surfTimer <= 0) player.isSurfing = false;
            }

            let speed = player.isSurfing ? 15 * 1.7 : 15;
            let moveZ = 0, moveX = 0;
            if (keys['KeyW']) moveZ -= 1;
            if (keys['KeyS']) moveZ += 1;
            if (keys['KeyA']) moveX -= 1;
            if (keys['KeyD']) moveX += 1;

            let moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize();
            moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotY);

            player.pos.x += moveVec.x * speed * dt;
            player.pos.z += moveVec.z * speed * dt;
            player.pos.y += player.vel.y * dt;

            if (player.pos.y > 2) {
                player.vel.y -= 35 * dt;
            } else {
                player.pos.y = 2; player.vel.y = 0;
                if (keys['Space']) player.vel.y = 12;
            }

            player.pos.x = Math.max(BOUNDS.minX, Math.min(BOUNDS.maxX, player.pos.x));
            player.pos.y = Math.max(BOUNDS.minY, Math.min(BOUNDS.maxY, player.pos.y));
            player.pos.z = Math.max(BOUNDS.minZ, Math.min(BOUNDS.maxZ, player.pos.z));

            camera.position.copy(player.pos);
            camera.rotation.set(0, 0, 0);
            camera.rotation.y = player.rotY;
            camera.rotation.x = player.rotX;

            if (player.isSurfing) {
                enemies.forEach(e => {
                    if (e.mesh.position.distanceTo(player.pos) < 2.5) applyDamage(e, 70);
                });
            }

            enemies = enemies.filter(e => e.hp > 0);
            enemies.forEach(e => {
                let dist = e.mesh.position.distanceTo(player.pos);
                let dir = player.pos.clone().sub(e.mesh.position).normalize();

                if (e.type === 'tawashi') {
                    e.timer += dt;
                    if (e.timer >= 3.5) {
                        e.invulnerable = !e.invulnerable;
                        e.angryFace.visible = e.invulnerable;
                        e.cryingFace.visible = !e.invulnerable;
                        e.timer = 0;
                    }
                }

                e.mesh.lookAt(player.pos.x, e.mesh.position.y, player.pos.z);
                if (dist > 2) e.mesh.position.add(dir.multiplyScalar(e.speed * dt));
                if (dist < 2.5) takePlayerDamage(e.atk * dt);
            });

            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
            floatingTexts.forEach(ft => {
                ft.life -= dt * 1.5;
                ft.sprite.position.y += dt * 1.2;
                ft.sprite.material.opacity = ft.life;
                ft.sprite.quaternion.copy(camera.quaternion);
            });

            if (waveSpawned && enemies.length === 0) {
                wave++; waveSpawned = false;
            }
            checkWaveTrigger();

            renderer.render(scene, camera);
        }

        function takePlayerDamage(amount) {
            player.hp -= amount;
            if (player.hp <= 0) {
                player.lives--;
                if (player.lives <= 0) {
                    showMessage("GAME OVER", 100000); isPaused = true;
                } else {
                    player.hp = player.maxHp; player.pos.set(0, 2, 0);
                    showMessage("死亡！ 残り機数: " + player.lives, 2000);
                }
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = Math.max(0, Math.floor(player.hp));
            document.getElementById('lives-val').innerText = player.lives;
            document.getElementById('stage-val').innerText = stage;
            document.getElementById('wave-val').innerText = wave + 1;

            const waves = STAGE_WAVES[stage];
            if (waves && waves[wave]) {
                let targetZ = waves[wave].triggerZ;
                let remainingDist = Math.max(0, Math.round(player.pos.z - targetZ));
                document.getElementById('progress-val').innerText = waveSpawned ? 
                    "戦闘中！ 敵を殲滅してください" : `あと ${remainingDist}m 奥へ進んでください`;
            } else {
                document.getElementById('progress-val').innerText = "ステージクリア！";
            }
            
            const w = WEAPONS[player.weaponIdx];
            document.getElementById('weapon-val').innerText = w.name;
            document.getElementById('weapon-desc').innerText = w.desc;

            if (w.name === "拳銃") {
                document.getElementById('ammo-val').innerText = player.isReloading ? 
                    `リロード中 (${player.reloadTimer.toFixed(1)}s)` : `${player.ammo} / 3`;
            } else {
                document.getElementById('ammo-val').innerText = "∞";
            }
        }

        function showMessage(text, time) {
            const el = document.getElementById('msg');
            el.innerText = text;
            el.style.display = text ? 'block' : 'none';
            if (time > 0) {
                setTimeout(() => { if (el.innerText === text) el.style.display = 'none'; }, time);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
